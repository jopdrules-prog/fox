name: Check FOX Producer Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/release-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/release-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Test version and release safety checks
        run: python3 -m unittest discover -s android/scripts/tests -v
      - name: Compile debug app
        run: gradle --no-daemon --no-configuration-cache :app:assembleDebug
        working-directory: android
      - name: Ensure release fails without signing configuration
        working-directory: android
        run: |
          if gradle --no-daemon --no-configuration-cache :app:assembleRelease > "$RUNNER_TEMP/missing-signing.log" 2>&1; then
            echo '::error::An unsigned release build unexpectedly succeeded'
            exit 1
          fi
          grep -F 'Release signing is required. Missing environment variables:' "$RUNNER_TEMP/missing-signing.log"
      # This disposable key is ONLY a CI fixture. No repository secrets are read,
      # and neither the key nor this signed test APK is uploaded or published.
      - name: Compile and verify a release using a disposable test key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fox-ci-only.jks
          ANDROID_KEYSTORE_PASSWORD: ci-test-only
          ANDROID_KEY_ALIAS: ci-test
          ANDROID_KEY_PASSWORD: ci-test-only
        run: |
          keytool -genkeypair -noprompt -storetype JKS -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=FOX CI TEST ONLY'
          export ANDROID_SIGNING_CERT_SHA256
          ANDROID_SIGNING_CERT_SHA256=$(keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          gradle --no-daemon --no-configuration-cache :app:assembleRelease
          python3 scripts/release.py verify-apk app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/fox-ci-verified"
      - name: Prepare explicitly marked debug artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FOX-Producer-TEST-ONLY-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FOX-Producer-TEST-ONLY-debug
          path: FOX-Producer-TEST-ONLY-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/fox-ci-only.jks" "$RUNNER_TEMP/missing-signing.log"
          rm -rf "$RUNNER_TEMP/fox-ci-verified"
